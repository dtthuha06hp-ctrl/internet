<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{{ cfg.SHOP_NAME }} – {{ cfg.SLOGAN }}{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
{% block meta %}<meta name="description" content="{{ cfg.SHOP_NAME }}: điện thoại và phụ kiện chính hãng, giá rõ ràng, so sánh và chọn máy theo nhu cầu. Website mô phỏng phục vụ học tập.">{% endblock %}
<link rel="icon" href="/static/images/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
{% include "layout/header.html" %}
<main class="wrap">
{% block content %}{% endblock %}
</main>
{% include "layout/footer.html" %}
<div class="toast" id="toast" role="status"><span id="toastTxt"></span><a href="/gio-hang" id="toastLink">Xem giỏ hàng</a></div>
<script>window.NM = {csrf: {{ csrf|json }}};</script>
<script src="/static/js/main.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
